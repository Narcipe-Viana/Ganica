# Coleta tendências do Google Trends (Brasil) para a pauta editorial.
# Roda todo dia às 5h10 (Brasília), antes das publicações das 6h39.
name: Coletar tendências

on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tendencias
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Coletar
        run: python3 scripts/tendencias.py
      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/tendencias.json editorial/TENDENCIAS.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Tendências do Google Trends ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
