# Publica o site: a cada alteração em main (CMS, tarefa agendada ou commit manual),
# gera o site com o Eleventy, roda as checagens e publica o resultado na branch gh-pages,
# que é a fonte do GitHub Pages.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 3 * * *"   # todo dia 00:05 (Brasília): regera o site para a etiqueta "Novo" expirar no prazo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          pip install --quiet pyyaml playwright
          python3 -m playwright install --with-deps chromium

      - name: Gerar imagens de compartilhamento que faltarem
        run: python3 scripts/og.py

      - name: Gerar o site
        run: npx @11ty/eleventy

      - name: Checagens de estrutura (sem navegador)
        run: python3 scripts/qa.py --sem-navegador

      - name: Publicar na branch gh-pages
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicação de ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
