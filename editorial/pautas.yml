    historico: "Pulada em 30/10/2026 (reprovada duas vezes por erro de método sobre o GA4). Devolvida à fila em 30/10/2026 com as correções em metodo_ga4. Pulada em 02/11/2026 e publicada no mesmo dia, depois de corrigida com fontes primárias."
    metodo_ga4:
